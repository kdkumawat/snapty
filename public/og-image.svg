<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Snapty — annotate screenshots with a hand-drawn feel. Privacy-first, runs in your browser.">
  <defs>
    <radialGradient id="g1" cx="20%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="100%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAFAF9"/>
      <stop offset="100%" stop-color="#F4F3F1"/>
    </linearGradient>
  </defs>

  <!-- Backdrop -->
  <rect width="1200" height="630" fill="#F4F3F1"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <!-- Faux browser chrome mock (sized for 1200x630) -->
  <g transform="translate(540 110)">
    <rect width="600" height="380" rx="22" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="2"/>
    <rect width="600" height="46" rx="22" fill="url(#chrome)"/>
    <rect y="34" width="600" height="12" fill="url(#chrome)"/>
    <circle cx="28" cy="23" r="6" fill="#FF5F57"/>
    <circle cx="48" cy="23" r="6" fill="#FEBC2E"/>
    <circle cx="68" cy="23" r="6" fill="#28C840"/>
    <rect x="200" y="11" width="200" height="24" rx="8" fill="#FFFFFF" stroke="#E7E5E4"/>

    <!-- Inside mock: a screenshot with annotations -->
    <g transform="translate(40 70)">
      <rect width="520" height="290" rx="14" fill="#FAFAF9" stroke="#E7E5E4"/>
      <rect x="24" y="24" width="200" height="14" rx="4" fill="#D6D3D1"/>
      <rect x="24" y="48" width="160" height="10" rx="3" fill="#E7E5E4"/>
      <rect x="24" y="100" width="200" height="100" rx="10" fill="#FFFFFF" stroke="#E7E5E4"/>
      <rect x="44" y="120" width="160" height="10" rx="3" fill="#E7E5E4"/>
      <rect x="44" y="140" width="100" height="8" rx="3" fill="#E7E5E4"/>
      <rect x="44" y="170" width="80" height="20" rx="6" fill="#EA580C"/>

      <!-- Step badge -->
      <g transform="translate(86 50)">
        <circle r="20" fill="#3B82F6"/>
        <text x="0" y="6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">1</text>
      </g>

      <!-- Handwritten note -->
      <g transform="translate(220 70) rotate(-3)">
        <text font-family="Caveat, 'Segoe Print', cursive" font-size="26" fill="#EA580C">check this flow</text>
      </g>

      <!-- Curved arrow to button -->
      <g transform="translate(280 170)" stroke="#EA580C" fill="none" stroke-width="3" stroke-linecap="round">
        <path d="M120 0 C 40 30, 0 60, -180 70"/>
      </g>
      <g transform="translate(280 170)" fill="#EA580C">
        <path d="M-66 132 L-58 152 L-78 152 Z" transform="rotate(20)"/>
      </g>
    </g>
  </g>

  <!-- Wordmark + tagline -->
  <g transform="translate(80 220)">
    <g transform="translate(0 -110)">
      <rect width="64" height="64" rx="16" fill="#EA580C"/>
      <!-- Scissor glyph (simplified) -->
      <g transform="translate(32 32)" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
        <circle cx="-10" cy="-10" r="5"/>
        <circle cx="-10" cy="10" r="5"/>
        <path d="M-6 -7 L18 18"/>
        <path d="M-6 7 L18 -18"/>
      </g>
    </g>
    <text x="0" y="40" font-family="Caveat, 'Segoe Print', cursive" font-size="120" font-weight="700" fill="#EA580C">Snapty</text>
    <text x="0" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="500" fill="#1C1917">
      Annotate screenshots with a hand-drawn feel.
    </text>
    <text x="0" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#57534E">
      Privacy-first · Keyboard-driven · 100% in your browser
    </text>
  </g>
</svg>
